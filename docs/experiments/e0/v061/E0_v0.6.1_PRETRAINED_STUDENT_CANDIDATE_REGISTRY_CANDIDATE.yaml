registry_id: E0-v0.6.1-PRETRAINED-STUDENT-CANDIDATES
registry_version: 0.2-candidate
prepared: 2026-09-11
status: CANDIDATE_NOT_FROZEN
purpose: >-
  Finite pretrained-student candidate registry for the v0.6.1 mechanism-selection
  stage. This registry must be frozen before any CMDR-MSEL-v0 model scoring.
  Candidate additions or substitutions after scoring require a new contract revision.

governance:
  contract: EXPERIMENT_E0_EXPERTISE_ADAPTER_UTILITY_CONTRACT_v0.6.1-candidate.md
  scoring_authorized: false
  bootstrap_authorized: false
  candidate_growth_after_scoring: prohibited
  selection_by_cmdr_score_before_registry_freeze: prohibited

candidate_policy:
  count: 1
  rationale: >-
    Use one compact base pretrained causal model to minimize candidate-shopping
    freedom while remaining in the same order of magnitude as the v0.5 C0 student.
    The candidate retains its native tokenizer as part of the treatment.
  lm_head_policy: remove_upstream_lm_head
  task_head: linear_hidden_to_3_with_bias
  tokenizer_policy: retain_native_tokenizer
  tokenizer_remapping: prohibited
  truncation: prohibited
  instruction_tuned_candidates: prohibited

candidates:
  - candidate_id: P0-70M
    upstream_provider: EleutherAI
    upstream_id: EleutherAI/pythia-70m
    upstream_revision: a39f36b100fe8a5377810d56c3f4789b9c53ac42
    upstream_revision_hex_length: 40
    revision_resolution_observed: true
    source_urls:
      model_card: https://huggingface.co/EleutherAI/pythia-70m
      tree_pinned: https://huggingface.co/EleutherAI/pythia-70m/tree/a39f36b100fe8a5377810d56c3f4789b9c53ac42
      config: https://huggingface.co/EleutherAI/pythia-70m/blob/main/config.json
      weights_pinned: https://huggingface.co/EleutherAI/pythia-70m/blob/a39f36b100fe8a5377810d56c3f4789b9c53ac42/model.safetensors
    license_observed: Apache-2.0
    model_class: GPT-NeoX causal language model
    pretraining_class: base_pretrained_not_instruction_tuned
    upstream_training_data_class: The Pile
    architecture_observed:
      hidden_size: 512
      num_hidden_layers: 6
      num_attention_heads: 8
      intermediate_size: 2048
      max_position_embeddings: 2048
      vocab_size: 50304
      rotary_emb_base: 10000
