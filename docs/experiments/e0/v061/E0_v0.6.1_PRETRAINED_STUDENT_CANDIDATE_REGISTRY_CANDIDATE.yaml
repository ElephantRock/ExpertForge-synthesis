    artifact_identity:
      model_safetensors_sha256_observed: ebfa4e2f18696ebd83716a0d39fe2c025f2ff8483f72a83ca59c475692fc9d15
      model_safetensors_sha256_local_verified: QUAL_BOUND
      exact_snapshot_manifest_sha256: QUAL_BOUND
      tokenizer_json_sha256: QUAL_BOUND
      tokenizer_config_json_sha256: QUAL_BOUND
      special_tokens_map_json_sha256: QUAL_BOUND
      config_json_sha256: QUAL_BOUND
      license_record_sha256: QUAL_BOUND

    downstream_classification_form:
      retained_components:
        - token_embeddings
        - transformer_backbone
        - final_norm
      removed_components:
        - upstream_lm_head
      added_components:
        - linear_512_to_3_classifier_with_bias
      expected_backbone_without_lm_head_params: 44670976
      expected_task_classifier_params: 1539
      expected_total_classification_params: 44672515
      exact_instantiated_parameter_count: QUAL_BOUND

    mechanism_cells:
      P-FROZEN:
        execution: primary_unconditional
        backbone_initialization: pretrained
        backbone_trainable: false
        task_head_trainable: true
        train_slice: R1
        optimizer_recipe: P-FROZEN

      P-RANDOM-FROZEN:
        execution: conditional_if_P-FROZEN_TRANSFER_PASS
        backbone_initialization: random_from_frozen_upstream_config
        backbone_trainable: false
        task_head_trainable: true
        train_slice: R1
        optimizer_recipe: P-FROZEN
        eligibility_as_final_student: false

      P-FT@R1:
        execution: primary_unconditional
        backbone_initialization: pretrained
        backbone_trainable: true
        task_head_trainable: true
        train_slice: R1
        optimizer_recipe: P-FT

      P-RANDOM@R1:
        execution: primary_unconditional
        backbone_initialization: random_from_frozen_upstream_config
        backbone_trainable: true
        task_head_trainable: true
        train_slice: R1
        optimizer_recipe: P-FT
        interpretation_scope: matched_P0_architecture_tokenizer_PFT_recipe_only

      P-FT@R16:
        execution: >-
          conditional_if_R1_R4_R16_P-RANDOM@R1_all_NO_TRANSFER_and_P-FT@R1_NO_TRANSFER
        backbone_initialization: pretrained
        backbone_trainable: true
        task_head_trainable: true
        train_slice: R16
        optimizer_recipe: P-FT

pre_execution_requirements:
  - independently download and verify exact pinned snapshot
  - verify local model.safetensors SHA-256 matches observed upstream SHA-256
  - compute and freeze config/tokenizer/special-token/snapshot digests
  - verify license/provenance record
  - instantiate classification form and verify exact parameter count
  - verify canonical CMDR rendered strings tokenize without invalid encodings
  - verify complete CMDR-MSEL-v0 token-length distribution
  - verify max P0 sequence length <= 384 native tokens
  - verify no truncation
  - verify terminal answer-cue state extraction identity
  - verify deterministic seed-bound random initialization for P-RANDOM cells
  - verify 12 GiB accelerator feasibility without model/optimizer offload
  - verify 400-update wall-clock smoke projection <= 8 h full-run ceiling

claim_language:
  allowed:
    - pretraining_treatment_supported_within_matched_P0_recipe
    - pretrained_frozen_linear_readout_viable
    - matched_P0_architecture_tokenizer_recipe_sufficient
  prohibited:
    - representation_prior_proven
    - equal_compute_R_vs_P
    - parameter_matched_R_vs_P
    - pretraining_generally_required

notes:
  - >-
    The revision string has 40 hexadecimal characters and resolves upstream.
    The observed safetensors SHA-256 is reported by the upstream file pointer,
    but bootstrap must independently verify the downloaded bytes before freeze.
  - >-
    P0-70M was chosen for design comparability, not because upstream benchmark
    results predict CMDR performance.
